name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker --quiet

      - name: Build and push image
        run: |
          gcloud builds submit .             --project ${{ secrets.GCP_PROJECT_ID }}             --tag us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ secrets.GCP_CLOUD_RUN_SERVICE }}:latest             --timeout=900

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCP_CLOUD_RUN_SERVICE }}             --project ${{ secrets.GCP_PROJECT_ID }}             --region ${{ secrets.GCP_CLOUD_RUN_REGION }}             --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ secrets.GCP_CLOUD_RUN_SERVICE }}:latest             --allow-unauthenticated             --quiet

      - name: Verify deployment
        run: |
          sleep 10
          SERVICE_URL=$(gcloud run services describe ${{ secrets.GCP_CLOUD_RUN_SERVICE }}             --project ${{ secrets.GCP_PROJECT_ID }}             --region ${{ secrets.GCP_CLOUD_RUN_REGION }}             --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"
          curl -s "$SERVICE_URL" | head -5 || echo "Site check failed"
