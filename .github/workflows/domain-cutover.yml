name: Legacy Cloud Run domain cutover retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Cloud Run domain cutover retired
        run: |
          echo "Do not point badactors.online back to Google Cloud Run."
          echo "The next production cutover target is Vercel."
          echo "Keep the current origin reachable only until the Vercel deployment and email signup flow are verified."
