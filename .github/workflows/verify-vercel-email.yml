name: Verify Vercel album email delivery

on:
  push:
    branches: [main]

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify Vercel album email delivery'
    runs-on: ubuntu-latest
    steps:
      - name: Post a test album signup to Vercel
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -X POST 'https://bad-actors-rnv8nq9hk-don-matthews.vercel.app/api/subscribe' \
            -H 'Content-Type: application/json' \
            --data '{"email":"badactorsalbum@gmail.com","name":"Bad Actors Test","source":"github-actions-vercel-validation"}')
          echo "$response"
          echo "$response" | jq -e '.success == true and .emailSent == true'
