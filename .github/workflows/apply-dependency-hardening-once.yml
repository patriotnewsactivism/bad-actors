name: Apply dependency hardening once

on:
  push:
    branches: [security/dependency-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted dependency updates
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall @kilocode/cli
          npm install react-router-dom@6.30.6
          npm install --save-dev postcss@8.5.26
          npm audit fix --package-lock-only || true
      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run build
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > prod-audit.json
          code=$?
          jq '{metadata:.metadata.vulnerabilities,direct:[.vulnerabilities|to_entries[]|select(.value.isDirect)|{name:.key,severity:.value.severity,via:[.value.via[]? | if type=="string" then . else .title end]}]}' prod-audit.json
          echo "audit_exit=$code"
          exit 0
      - name: Commit hardened dependency graph and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-dependency-hardening-once.yml
          git config user.name "Matthew Reardon"
          git config user.email "patriotnewsactivism@proton.me"
          git add package.json package-lock.json .github/workflows/apply-dependency-hardening-once.yml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "security: harden frontend dependency graph"
          git push origin HEAD:security/dependency-hardening
